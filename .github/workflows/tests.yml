name: Tests

# The CODE gate, on every push and pull request: the Python suite, the headless
# GUI smoke test, and the web page's own Node tests. `pages.yml` is a different
# gate — it decides what may be PUBLISHED — and the two never depend on each
# other: a red page test still stops this one, but it stops the publication by
# its own route.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reading the checkout, nothing else: no artifact, no deployment, no token.
permissions:
  contents: read

# A superseded push's run answers for a commit nobody will merge: cancel it
# rather than pay for the older one to finish last.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # A native crash inside a Qt or PortAudio call kills the PROCESS, not a
      # test: faulthandler prints the Python stack of every thread at that
      # moment, which is the only way the job names the test it died in.
      PYTHONFAULTHANDLER: "1"
      # Qt and PortAudio both want a session directory; a runner has none, and
      # the noisy fallback hides the real message.
      XDG_RUNTIME_DIR: /tmp/v2m-run
      LIBGL_ALWAYS_SOFTWARE: "1"
      # `SUITE_BUDGET_S` is calibrated on a development machine (tests/conftest.py
      # keeps the dated history) and turns a GREEN over-budget run red. A shared
      # runner is slower and never idle, so the workflow raises the tripwire
      # through the environment instead of loosening it for everyone: the
      # default stays 150 s for the machine it was measured on.
      # 900, not 150: the run is SERIAL here (see the suite step, which explains
      # why) and a shared runner is slower — measured ×1.9 from parallel on a
      # developer machine, so 600 leaves no room once the runner is slow too.
      V2M_SUITE_BUDGET_S: "900"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: The Qt and PortAudio libraries a headless runner lacks
        # PyQt6's wheels carry Qt but not these; sounddevice imports
        # libportaudio at runtime. Without them the GUI tests abort natively
        # instead of failing a test.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libportaudio2
      - name: Install the package and the development extras, at the pinned versions
        # The extras carry pytest-xdist (addopts asks for two workers) and ruff.
        # `-c constraints.txt` is NOT optional here: pyproject asks for ranges,
        # and an unconstrained resolve on this image took librosa 1.0.1 / numba
        # 0.68.1 / numpy 2.5.5 / PyQt6 6.12.1 where the audio goldens were frozen
        # on 1.0.0 / 0.67.0 / 2.5.3 / 6.11.0 — the suite then reports a
        # different engine as 143 regressions.
        run: pip install -e ".[dev]" -c constraints.txt
      - name: The demo take the smoke test reads
        # gitignored, and the suite's yin fixtures refuse any other file of that
        # name: regenerate it rather than ship it.
        run: python scripts/make_demo.py
      - name: The suite
        # SERIAL on purpose (`-n 0` overrides the `-n 2` addopts): two worker
        # processes are separate PIDs, so a native crash inside one loses the
        # step's output and reports only "Segmentation fault" — and a runner
        # has two slow cores to split anyway. The budget above has the room.
        run: |
          install -d -m 700 "$XDG_RUNTIME_DIR"
          set -o pipefail
          pytest tests/ -q -n 0 2>&1 | tee "$RUNNER_TEMP/suite.log"
      - name: Keep the suite's log
        # `always()`: the crash trace is exactly what a failed run leaves behind,
        # and the step view truncates it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: ${{ runner.temp }}/suite.log
          if-no-files-found: warn
      - name: The window opens headless and every page answers
        run: python -u scripts/gui_smoke_test.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The page's own tests
        # `web/test/browser.mjs` drives the Chrome the runner image ships, so
        # nothing is installed here. The capture test SKIPS without an audio
        # device — `pages.yml`'s `capture` job is the one that provisions a null
        # sink for it — and the take-reading tests skip without `demo.wav`,
        # which this job does not build. The parity phrase IS committed, so its
        # comparison with the desktop runs here too, on the runner's own rate.
        #
        # ONE FILE AT A TIME. Every file starts its own Chrome, and the capture,
        # CSP and keyboard checks run the page's real-time audio graph: eighteen
        # browsers at once starved it, and two takes of ONE fake recording
        # drifted 0.314 s apart (measured; the same files pass serially). The
        # take comparison keeps its 60 ms limit — widening it would hide a lost
        # audio block, which is the failure it exists to catch.
        run: node --test --test-concurrency=1 web/test/*.test.mjs

  web-matrix:
    # One engine is not "the web": WebKit has no `Symbol.asyncIterator` on
    # `ReadableStream`, so the ZIP's compressor threw, every entry was stored,
    # the archive stayed valid at 1.5× the size, and a green Chromium said
    # nothing. The five checks that matter are replayed in all three engines,
    # from a harness in `tests/` — the page stays a dependency-free folder and
    # the driver is borrowed here, pinned, never vendored.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false  # one engine's red must not hide the others
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Borrow a driver, pinned
        # Not a project dependency and not committed: `npm install --no-save`
        # writes nothing to the tree that git tracks, and `--with-deps` is what
        # gives WebKit its system libraries on a bare runner.
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: ${{ matrix.engine }} reads the demo, exports, and reads a chosen file and phrase
        run: node tests/web_matrix/run.mjs ${{ matrix.engine }}
