name: Tests

# The CODE gate, on every push and pull request: the Python suite, the headless
# GUI smoke test, and the web page's own Node tests. `pages.yml` is a different
# gate — it decides what may be PUBLISHED — and the two never depend on each
# other: a red page test still stops this one, but it stops the publication by
# its own route.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reading the checkout, nothing else: no artifact, no deployment, no token.
permissions:
  contents: read

# A superseded push's run answers for a commit nobody will merge: cancel it
# rather than pay for the older one to finish last.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # `SUITE_BUDGET_S` is calibrated on a development machine (tests/conftest.py
      # keeps the dated history) and turns a GREEN over-budget run red. A shared
      # runner is slower and never idle, so the workflow raises the tripwire
      # through the environment instead of loosening it for everyone: the
      # default stays 150 s for the machine it was measured on.
      V2M_SUITE_BUDGET_S: "600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: The Qt and PortAudio libraries a headless runner lacks
        # PyQt6's wheels carry Qt but not these; sounddevice imports
        # libportaudio at runtime. Without them the GUI tests abort natively
        # instead of failing a test.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libportaudio2
      - name: Install the package and the development extras
        # The extras carry pytest-xdist (addopts asks for two workers) and ruff.
        run: pip install -e ".[dev]"
      - name: The demo take the smoke test reads
        # gitignored, and the suite's yin fixtures refuse any other file of that
        # name: regenerate it rather than ship it.
        run: python scripts/make_demo.py
      - name: The suite
        run: pytest tests/ -q
      - name: The window opens headless and every page answers
        run: python -u scripts/gui_smoke_test.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The page's own tests
        # `web/test/browser.mjs` drives the Chrome the runner image ships, so
        # nothing is installed here. The capture test SKIPS without an audio
        # device — `pages.yml`'s `capture` job is the one that provisions a null
        # sink for it — and the take-reading tests skip without `demo.wav`,
        # which this job does not build.
        run: node --test web/test/*.test.mjs
