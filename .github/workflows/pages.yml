name: Web page

# Publishes `web/` to GitHub Pages. The page is a plain folder (no build
# step), so the only thing standing between a push and the published site is
# the port's conformance test: it replays the desktop's own segmentation
# cases against the JavaScript copy, and a divergence must not reach users.
#
# One manual step, once per repository: Settings -> Pages -> Source ->
# "GitHub Actions". Without it the deploy job fails with a clear message.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The deploy needs nothing else: reading the checkout, writing the Pages
# deployment, and the OIDC token GitHub Pages exchanges for it.
permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time, and a superseded push never lands: two pushes in a
# row would otherwise race, and the older one could finish LAST and publish a
# page the newer commit already replaced.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The web port decides the desktop's notes
        run: node --test web/test/segmenter.test.mjs
      - name: The page's intonation line is the desktop's summary
        # The one port nothing else compared: the line is VISIBLE ("N of M
        # notes in tune") and its rules are thresholds, so a fixture generated
        # from `core.intonation.summarize` over the traps — too few notes, a
        # mean under 12 cents, identical pitches, an odd count — is replayed
        # here. It needs no browser and no take.
        run: node --test web/test/intonation.test.mjs
      - name: The web port's YIN reads the desktop's frames
        # Skips where demo.wav is absent (it is gitignored and reproducible
        # with scripts/make_demo.py); the fixture's digest refuses any other
        # take under that name.
        run: node --test web/test/yin.test.mjs
      - name: The web port's YIN keeps the 44.1 and 48 kHz geometry
        # A device's frame is not the analysis rate's, and 48 kHz's 1115-sample
        # window is not a power of two: the page's own rule must still produce
        # those frozen windows and frames. Same skip as above without the take.
        run: node --test web/test/yin-rates.test.mjs
      - name: The MIDI a reader downloads keeps every repeat's own length
        # The writer is hand-written, so no library refuses a bad tick: the two
        # rules a reader cannot see are pinned here. An OFF sorts before an ON
        # at a shared tick, and a same-pitch repeat the analysis leaves
        # overlapping (measured 20 ms on chant.wav and demo.wav) releases the
        # note before it at the repeat's attack — written as it stands, that
        # note's OFF would close the repeat at its own start and a 0.18 s note
        # reads as 0.02 s. It needs no browser and no device, so it belongs in
        # the job that decides what may be published.
        run: node --test web/test/midi.test.mjs

      - name: The take a reader CHOOSES is read, exported and bundled
        # The decoder's own path: a real WAV through `decodeAudioData`, then the
        # page's chain, the table, the MIDI download and the ZIP read back
        # through its raw headers. It needs no audio device, so it belongs in
        # the job that decides what may be published.
        run: node --test web/test/file.test.mjs
      - name: A chosen phrase is read as the desktop's live chain reads it
        # The one check that compares AUDIO instead of fixtures: the committed
        # phrase and its per-rate desktop reading, both in the checkout, so it
        # needs no take to build and no microphone.
        run: node --test web/test/parity.test.mjs
      - name: The page is driven from the file picker to the export by keyboard
        # Tab, Enter and Space with the order a reader walks: the masthead, the
        # tutorial, the file input, then the take's listening and export row.
        # It needs no device — the half that toggles playback skips with its
        # measured reason where the runner has no output, and `capture` (the
        # job with the null sink) runs that half with `V2M_REQUIRE_AUDIO=1`.
        run: node --test web/test/keyboard.test.mjs
      - name: Every number the page shows, in both languages
        # The locale floor broke twice at a call SITE, which no unit test of the
        # formatter can see: one take is read in French and in English, and every
        # number a reader meets — the table, the summary, the two spoken
        # attributes and the roll's own painted marks — must carry the page's
        # separator, with the same numbers on both sides. A page that showed no
        # number fails too, so an empty inventory cannot pass.
        run: node --test web/test/numbers.test.mjs
      - name: The page's own Content-Security-Policy refuses nothing it needs
        # The head's meta allows 'self' and the ONE blob: the worklet module is
        # built from. The test pins the directives and drives the page — demo,
        # playback, archive, and (where an output exists) the real capture —
        # while the page records every securitypolicyviolation and the browser's
        # own log is read for a refusal.
        run: node --test web/test/csp.test.mjs
      - name: A playback graph that never starts says so instead of waiting forever
        # The page bounds the playback start the way it already bounds the
        # microphone's. The test builds the dead output in the page — `state`
        # reads `suspended`, `resume()` never settles — so it needs no sound
        # card of its own, and requires `error_play` after the bound.
        run: node --test web/test/playback-failure.test.mjs

      - name: The wide page is photographed at 1600 px
        # The layout no unit test can see: the 1040 px measure, the notes
        # table's flush-right numbers, the masthead. Chrome ships on the
        # runner and the script serves web/ itself, so nothing is installed
        # for this — and it also FAILS on the wide facts, so a break stops the
        # deploy instead of waiting in an artifact nobody opens.
        run: node web/test/wide-shot.mjs wide-1600.png
      - name: Keep the 1600 px screenshot
        # `always()`: a shot taken just before the check failed is the one worth
        # looking at, so the picture outlives the step that refused it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wide-screenshot
          path: wide-1600.png
          if-no-files-found: warn

      - name: Every listening failure says so on screen and on the console
        # Seven failures — permission, no device, a device another application
        # holds, a page outside a secure context, an output that never starts,
        # a worklet whose module refuses, and the secure-context case — each
        # pressed through the real `startCapture` and read back from `#status`
        # AND from the `capture failed [stage]: name` line, stage included: a
        # mic refusal and a worklet refusal are both NotAllowedError, so only
        # that bracket tells which half of the page broke. The mapping is pinned
        # as source text by the Python suite; this proves the words reach the
        # page. The graph is stubbed and the insecure case is served from the
        # machine's own address, so a runner with no sound card still runs it.
        run: node --test web/test/mic-failures.test.mjs

      - name: The page holds at every resolution class
        # The four CSS queries carry the whole layout and no unit test can see
        # their RESULT: eight classes are measured in a browser (320 px to
        # 2560 px, plus a phone held sideways), and a sideways scroll, a lost
        # measure, a masthead that eats a landscape phone or a control under the
        # 24 px tap floor stops the deploy.
        run: node web/test/resolutions.mjs

      - name: Get axe-core (pinned, never vendored)
        # Downloaded here rather than committed: the page stays dependency-free,
        # and the version is pinned so a new rule cannot arrive on its own and
        # turn an unrelated push red.
        run: curl -sSfL -o "$RUNNER_TEMP/axe.min.js" https://cdn.jsdelivr.net/npm/axe-core@4.10.2/axe.min.js
      - name: Both palettes pass the accessibility audit at every resolution
        # Forty-eight audits per run: the two palettes, by the three states a
        # reader can see (no take, a take, a row being heard), by the eight
        # resolution classes the layout has a rule for. A control that collides
        # with its neighbour at 600 px is unreadable to every reader, and a
        # 1600 px audit alone reports it as fine. Any violation AND any rule axe
        # could not decide fails the deploy — an undecided check is a check
        # nobody made.
        run: node web/test/axe-audit.mjs --axe "$RUNNER_TEMP/axe.min.js"

  capture:
    # The microphone path on Chrome's fake device: the one user path nothing
    # else presses. It stands in its OWN job because its PulseAudio provisioning
    # is the fragile part — a null sink that never starts must read as a red
    # job with its own log, not as a mystery inside `verify`.
    #
    # It GATES the publication: `deploy` refuses to run when this job fails.
    # The one way past it is the repository variable `MIC_CAPTURE_WAIVED` set to
    # `true`, which is a deliberate, logged exception (the deploy job annotates
    # the run) and must be taken back once the recipe is green again — a page
    # that has proven everything else and cannot record is the exact failure
    # this job exists to catch.
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a stuck browser must not hold the page hostage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Give the runner an output device Chrome will open
        # `AudioContext` leaves `suspended` only once an output stream can
        # start, and a runner has none — the capture then fails with the page's
        # own "audio engine" line, which is what it is for. PulseAudio's null
        # sink is a real output device to Chrome, but three things must hold:
        # the server needs `XDG_RUNTIME_DIR` (a runner has no session), the
        # sink must be the DEFAULT one, and the later steps must inherit the
        # directory so the browser finds that same server.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/pulse"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=v2m
          pactl set-default-sink v2m
          pactl info
          pactl list short sinks
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: The microphone path opens a take and exports it twice the same
        # Chrome's own fake microphone (`--use-fake-device-for-media-stream`,
        # a generated tone file) drives the page's REAL chain — permission,
        # worklet, YIN, segmenter, MIDI export — twice, and the two takes must
        # transcribe the same NOTES (a lost block may shift a tick; a wrong note
        # is the failure). `V2M_REQUIRE_AUDIO` refuses the skip a machine without
        # an output device would otherwise take, so a broken null sink fails
        # here instead of hiding the coverage.
        env:
          V2M_REQUIRE_AUDIO: "1"
        run: node --test web/test/capture.test.mjs

      - name: A Space press on the take is ONE action, on a machine that can sound
        # The focus walk already gated the deploy; the HALF that toggles
        # playback awaits the page's audio graph, which only this job's null
        # sink can start — so this is where `V2M_REQUIRE_AUDIO` refuses the
        # skip instead of letting a soundless runner pass for coverage.
        env:
          V2M_REQUIRE_AUDIO: "1"
        run: node --test web/test/keyboard.test.mjs

      - name: A sequence of gestures keeps one graph, one source and one clock
        # The gestures as a singer chains them — Space, a click in the roll, an
        # arrow, a click landing DURING a restart, a held arrow, Space again —
        # because the race they once lost lives between gestures, not inside
        # any one of them: at every step at most one audio graph and one buffer
        # source may be live, the sequence may never say "playback could not
        # start", and the clock must agree with itself and with the slider.
        env:
          V2M_REQUIRE_AUDIO: "1"
        run: node --test web/test/gestures.test.mjs

      - name: The notes table follows the row that sounds
        # The decision (`playingRowScroll`) has its own unit test; this is the
        # wiring that decision exists for, measured on a take longer than the
        # window. The playhead only ticks once the page's audio graph runs, so a
        # runner with no output device can only report — this job's null sink is
        # what lets `V2M_REQUIRE_AUDIO` refuse that report instead.
        env:
          V2M_REQUIRE_AUDIO: "1"
        run: node --test web/test/follow.test.mjs

      - name: "The worklet's in-memory blob: module loads under the policy"
        # The policy's one exception is the worklet; a runner with no output
        # cannot start the graph that loads it. This job has the null sink, so
        # `V2M_REQUIRE_AUDIO` turns the skip into a failure here.
        env:
          V2M_REQUIRE_AUDIO: "1"
        run: node --test web/test/csp.test.mjs

  deploy:
    needs: [verify, capture]
    # BOTH jobs are the gate. `capture` failing means the page's only real
    # recording path was not proven, so nothing is published — the default is
    # refusal, not a variable somebody has to remember to set.
    #
    # `!cancelled()` keeps a red `capture` from silently SKIPPING this job: the
    # waiver step below has to be able to see it and say so out loud.
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.capture.result == 'success' || vars.MIC_CAPTURE_WAIVED == 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: The microphone gate was WAIVED
        # The one door past a red capture, and it is never quiet: the run gets a
        # warning annotation naming what was not proven. It exists for a broken
        # runner recipe, not for a broken page — a red capture with a working
        # sink IS the page's bug, and waiving it publishes a page no singer can
        # record with.
        if: ${{ needs.capture.result != 'success' }}
        run: |
          echo "::warning title=Microphone gate waived::MIC_CAPTURE_WAIVED is true and the capture job did not pass — this publishes a page whose recording path was not proven. Take the waiver back once the job is green."

      - uses: actions/checkout@v4
      # `enablement: true` may create the Pages site on a first push, so this one
      # step both configures and enables it — a second, bare call would run the
      # same thing twice.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: The PUBLISHED page answers and reads a take
        # The one check no checkout can make: every other test serves `web/`
        # itself, so a 404 while the CDN catches up, a project site that lives
        # under /<repo>/ instead of /, a module served as text/plain (which the
        # browser's own import rule refuses) or a `strings.json` missing from
        # the artifact would only ever show in a visitor's console. This reads
        # the url a visitor gets — headers, both files, the demo chain and the
        # language switch — so the failure surfaces in this run, not in a
        # visitor's console. It runs AFTER the deploy, so a red here reports a
        # site that is already online: nothing is withdrawn automatically.
        run: node web/test/published.mjs "${{ steps.deployment.outputs.page_url }}"
