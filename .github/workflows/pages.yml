name: Web page

# Publishes `web/` to GitHub Pages. The page is a plain folder (no build
# step), so the only thing standing between a push and the published site is
# the port's conformance test: it replays the desktop's own segmentation
# cases against the JavaScript copy, and a divergence must not reach users.
#
# One manual step, once per repository: Settings -> Pages -> Source ->
# "GitHub Actions". Without it the deploy job fails with a clear message.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The deploy needs nothing else: reading the checkout, writing the Pages
# deployment, and the OIDC token GitHub Pages exchanges for it.
permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time, and a superseded push never lands: two pushes in a
# row would otherwise race, and the older one could finish LAST and publish a
# page the newer commit already replaced.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The web port decides the desktop's notes
        run: node --test web/test/segmenter.test.mjs
      - name: The web port's YIN reads the desktop's frames
        # Skips where demo.wav is absent (it is gitignored and reproducible
        # with scripts/make_demo.py); the fixture's digest refuses any other
        # take under that name.
        run: node --test web/test/yin.test.mjs
      - name: The web port's YIN keeps the 44.1 and 48 kHz geometry
        # A device's frame is not the analysis rate's, and 48 kHz's 1115-sample
        # window is not a power of two: the page's own rule must still produce
        # those frozen windows and frames. Same skip as above without the take.
        run: node --test web/test/yin-rates.test.mjs

      - name: The wide page is photographed at 1600 px
        # The layout no unit test can see: the 1040 px measure, the notes
        # table's flush-right numbers, the masthead. Chrome ships on the
        # runner and the script serves web/ itself, so nothing is installed
        # for this — and it also FAILS on the wide facts, so a break stops the
        # deploy instead of waiting in an artifact nobody opens.
        run: node web/test/wide-shot.mjs wide-1600.png
      - name: Keep the 1600 px screenshot
        # `always()`: a shot taken just before the check failed is the one worth
        # looking at, so the picture outlives the step that refused it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wide-screenshot
          path: wide-1600.png
          if-no-files-found: warn

      - name: Every listening failure says so on screen and on the console
        # Seven failures — permission, no device, a device another application
        # holds, a page outside a secure context, an output that never starts,
        # a worklet whose module refuses, and the secure-context case — each
        # pressed through the real `startCapture` and read back from `#status`
        # AND from the `capture failed [stage]: name` line, stage included: a
        # mic refusal and a worklet refusal are both NotAllowedError, so only
        # that bracket tells which half of the page broke. The mapping is pinned
        # as source text by the Python suite; this proves the words reach the
        # page. The graph is stubbed and the insecure case is served from the
        # machine's own address, so a runner with no sound card still runs it.
        run: node --test web/test/mic-failures.test.mjs

      - name: The page holds at every resolution class
        # The four CSS queries carry the whole layout and no unit test can see
        # their RESULT: eight classes are measured in a browser (320 px to
        # 2560 px, plus a phone held sideways), and a sideways scroll, a lost
        # measure, a masthead that eats a landscape phone or a control under the
        # 24 px tap floor stops the deploy.
        run: node web/test/resolutions.mjs

      - name: Get axe-core (pinned, never vendored)
        # Downloaded here rather than committed: the page stays dependency-free,
        # and the version is pinned so a new rule cannot arrive on its own and
        # turn an unrelated push red.
        run: curl -sSfL -o "$RUNNER_TEMP/axe.min.js" https://cdn.jsdelivr.net/npm/axe-core@4.10.2/axe.min.js
      - name: Both palettes pass the accessibility audit at every resolution
        # Forty-eight audits per run: the two palettes, by the three states a
        # reader can see (no take, a take, a row being heard), by the eight
        # resolution classes the layout has a rule for. A control that collides
        # with its neighbour at 600 px is unreadable to every reader, and a
        # 1600 px audit alone reports it as fine. Any violation AND any rule axe
        # could not decide fails the deploy — an undecided check is a check
        # nobody made.
        run: node web/test/axe-audit.mjs --axe "$RUNNER_TEMP/axe.min.js"

  capture:
    # The microphone path on Chrome's fake device: the one user path nothing
    # else presses. It stands ALONE because its PulseAudio provisioning has
    # never run on a runner — a null sink that never starts must show up as a
    # red job, not hold the published page offline.
    #
    # So it gates nothing yet: `deploy` runs whatever this job says, unless the
    # repository variable `MIC_CAPTURE_REQUIRED` is `true`. Set that variable
    # once a run here is green — from then on a red capture DOES block the
    # publication, which is the only way the coverage stays honest.
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a stuck browser must not hold the page hostage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Give the runner a sound card to start an audio graph on
        # `AudioContext.resume()` settles only once an output device can start,
        # and a runner has none — the capture would skip. A null sink is a real
        # output device to Chrome.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio --start --exit-idle-time=-1 --load="module-null-sink sink_name=v2m"
          pactl info

      - name: The microphone path opens a take and exports it twice the same
        # Chrome's own fake microphone (`--use-fake-device-for-media-stream`,
        # a generated tone file) drives the page's REAL chain — permission,
        # worklet, YIN, segmenter, MIDI export — twice, and the two exports must
        # be the same bytes. `V2M_REQUIRE_AUDIO` refuses the skip a machine
        # without an output device would otherwise take, so a broken null sink
        # fails here instead of hiding the coverage.
        env:
          V2M_REQUIRE_AUDIO: "1"
        run: node --test web/test/capture.test.mjs

  deploy:
    needs: [verify, capture]
    # `!cancelled()` because a failed `capture` must not skip the deploy — the
    # capture job is the experiment here, not the gate (see its comment).
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.capture.result == 'success' || vars.MIC_CAPTURE_REQUIRED != 'true') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # `enablement: true` may create the Pages site on a first push, so this one
      # step both configures and enables it — a second, bare call would run the
      # same thing twice.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
