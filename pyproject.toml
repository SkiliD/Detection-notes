[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-to-midi"
version = "0.1.0"
description = "Voix -> MIDI : détection des notes, du tempo et de la tonalité d'une voix, export MIDI + rapport JSON/CSV, GUI desktop et mode temps réel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "mido>=1.3",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3", "ruff>=0.6", "pyright>=1.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false

[project.scripts]
v2m = "v2m.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "2"]
markers = [
    "slow: takes >= 2 s (golden fingerprints replay real takes) — deselect with `-m 'not slow'` for a quick loop",
]
